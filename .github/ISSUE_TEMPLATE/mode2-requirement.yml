name: Mode 2.1 需求
description: 一句话需求（轻量流程入口，T0/T1）
title: "[REQ] "
labels: ["status:spec"]
body:
  - type: textarea
    id: one-liner
    attributes:
      label: 一句话需求
      description: 用一句话说清要什么
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 为什么需要，现状是什么
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 做完后什么样算对（验收视角）
  - type: textarea
    id: out-of-scope
    attributes:
      label: 范围外
      description: 明确不做什么（防范围蔓延）
