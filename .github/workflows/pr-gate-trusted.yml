# LACD v1.0 pr-gate 可信控制层（Trusted Control Plane）
# workflow 定义来自 base 分支，不执行 PR 代码，只做策略核验。
# 本 job（pr-gate-trusted / policy）为 main 的 required check：结论即门禁。
# 2026-10-12 LACD 迁移（PR #140，Human 已批准设计）：
# - policy-gate.py 重写为 LACD 门禁：只做 PR 身份/来源/HEAD 绑定、Bot 作者绑定、
#   路径分级报告、status:hold 阻断、测试完整性基线。
# - 取消：mode2-freeze / mode2-review 评论解析、Human 审批的 Python 重验、
#   tests/evidence 成功状态的重复核验（原生 Required Checks 独立强制）、
#   review bundle 校验。T2 准入授权移交 CODEOWNERS + 原生分支保护。
# 历史（rev5，回应 rev4 独立安全复审 P0-1）：
# - 移除 pull_request_review 触发器：该事件执行 PR merge commit 中的 workflow
#   定义（低信任），攻击者可借此产出同名假绿灯冒充 required check。
#   可信 job 只订阅 pull_request_target（base 定义）。
# - pull_request_target 增加 edited 类型：PR body/title/base 修改后重核验。
# - 审批变化不自动重核验是 GitHub 信任模型的固有限制；绝不用低信任事件冒充可信检查。
# rev4：base 前置守卫；Action pin 到 commit SHA；pyyaml==6.0.3。
# Stage3（2026-10-10）：issues: read 保留——policy-gate 读关联 Issue 标签查 hold。
name: pr-gate-trusted
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: 目标分支守卫（checkout 前）
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "目标分支必须为 main"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}  # 取 base 分支最新（gate 修复即时生效），不碰 PR 代码
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install "pyyaml==6.0.3"
      - name: 门禁自测（base 版负面测试）
        run: python .github/scripts/gate_selftest.py
      - name: LACD 策略核验（身份/来源/分级/完整性）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python .github/scripts/policy-gate.py
