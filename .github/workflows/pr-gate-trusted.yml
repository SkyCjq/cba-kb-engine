# Mode 2.1 pr-gate 可信控制层（Trusted Control Plane）— rev5
# workflow 定义来自 base 分支，不执行 PR 代码，只做策略核验。
# 本 job（pr-gate-trusted / policy）为 main 的 required check：结论即门禁。
# rev5 变更（回应 rev4 独立安全复审 P0-1）：
# - 移除 pull_request_review 触发器：该事件执行 PR merge commit 中的 workflow
#   定义（低信任），攻击者可借此产出同名假绿灯冒充 required check。
#   可信 job 只订阅 pull_request_target（base 定义）。
# - pull_request_target 增加 edited 类型：PR body/title/base 修改后重核验。
# - 审批变化不自动重核验是 GitHub 信任模型的固有限制（见 queue-runbook 的
#   诚实说明与缓解）；绝不用低信任事件冒充可信检查。
# rev4：base 前置守卫；Action pin 到 commit SHA；pyyaml==6.0.3。
# Stage3（2026-10-10）：增 issues: read——policy-gate 需读需求 Issue 评论取 freeze 签发，缺之则 403 崩溃。
# DRAFT：App 审批机制（纯 T0）待 #10 实测；在通过前所有 tier 均需 Human approval。
name: pr-gate-trusted
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: 目标分支守卫（checkout 前）
        run: |
          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "目标分支必须为 main"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}  # 只取 base，不碰 PR 代码
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install "pyyaml==6.0.3"
      - name: 门禁自测（base 版负面测试）
        run: python .github/scripts/gate_selftest.py
      - name: 策略核验（tier/digest/隔离层/审批）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TRUSTED_AUTHORS: "SkyCjq,cba-kb-muse-mode2-bot[bot]"
        run: python .github/scripts/policy-gate.py
