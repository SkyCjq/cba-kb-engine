name: Offline tests

on:
  push:
    branches: ['codex/**', 'main']
  pull_request:

permissions:
  contents: read

jobs:
  cleanroom-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install documented public environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Public doctor without private configuration
        run: make doctor
      - name: REQ-202 clean-room operations smoke
        run: |
          source .venv/bin/activate
          .venv/bin/python scripts/run_cleanroom_smoke.py --output "$RUNNER_TEMP/cba-kb-cleanroom"
          .venv/bin/python -m pytest -q tests/test_cleanroom_operations.py

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Tracked secret and credential guard
        run: python scripts/check_secrets.py --tracked
      - run: python -m pip install -r requirements.lock
      - name: Deterministic workflow hardening canary
        run: PYTHONPATH=src:legacy python -m automation.orchestrator hardening-canary
      - name: Public Engine boundary and watcher synthetic tests
        run: |
          python -m pytest -q \
            tests/test_engine_instance_boundary.py \
            tests/test_ingestion_kernel.py \
            tests/test_source_watcher.py \
            tests/test_cli_instance_config.py \
            tests/test_catalog_instance_boundary.py \
            tests/test_public_readiness_probe.py
      - name: PNG exclusion regression
        run: python -m pytest -q tests/test_source_exclusions.py
      - name: v1.5.3 event closure controls
        run: |
          python -m pytest -q tests/test_event_closure.py
          python -m pytest -q \
            tests/test_event_closure.py::test_event_closure_is_deterministic \
            tests/test_build_facts.py::test_xlsx_writer_is_deterministic
      - name: v1.5.3 registration semantics
        run: python -m pytest -q tests/test_registration_domain.py tests/test_draft2_regressions.py
      - name: Offline regression suite
        env:
          CBA_KB_SOURCE_POLICY_JSON: '{"excluded_drive_ids":[]}'
        run: |
          python -m pytest -q -rs \
            --deselect tests/test_prepare_v1_5_2.py::test_v1_5_2_registry_proposal_is_complete

      # ---- P3 迁移（2.0.3-5 R5）：以下步骤自 pr-gate-untrusted.yml 的 evidence job 迁移 ----
      # 等效性：每个步骤失败仍使 job 失败（阻断语义与原 evidence job 一致）；
      # 顺序与原 evidence job 一致；仅在 pull_request 事件运行（push 到 main 无 PR 上下文）。
      - name: Full pytest suite (evidence parity)
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH pytest tests/ -q 2>&1 | tee pytest.log
      - name: 门禁自测（PR 版，阻断）
        if: github.event_name == 'pull_request'
        run: python .github/scripts/gate_selftest.py
      - name: 测试完整性指标采集（阻断）
        if: github.event_name == 'pull_request'
        run: python .github/scripts/integrity-scan.py --out integrity.json
      - name: 计算展示用 tier（阻断；执行失败仍使 job 失败）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/display-tier.py
      - name: 生成审查材料包（阻断）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python .github/scripts/build-review-bundle.py --pytest-log pytest.log --tier "$(cat tier.txt)" --out review-bundle.md
      - name: 风险展示校验（阻断；缺失/过期/错绑即失败）
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'EOF'
          import json, os, re, sys
          head = os.environ["HEAD_SHA"]
          def fail(m):
              print("RISK-DISPLAY FAIL:", m, file=sys.stderr); sys.exit(1)
          try:
              integ = json.load(open("integrity.json", encoding="utf-8"))
          except Exception as e:
              fail(f"integrity.json 缺失或非法: {e}")
          for k in ("test_files", "test_funcs", "asserts"):
              if k not in integ: fail(f"integrity.json 缺少键 {k}")
          try:
              tier = open("tier.txt", encoding="utf-8").read().strip()
          except Exception as e:
              fail(f"tier.txt 缺失: {e}")
          if tier not in ("T0", "T1", "T2"): fail(f"tier.txt 非法值: {tier!r}")
          try:
              bundle = open("review-bundle.md", encoding="utf-8").read()
          except Exception as e:
              fail(f"review-bundle.md 缺失: {e}")
          m = re.search(r"BUNDLE_HEAD_SHA: ([0-9a-f]{40})", bundle)
          if not m: fail("bundle 缺少 BUNDLE_HEAD_SHA 绑定")
          if m.group(1) != head: fail(f"bundle HEAD 错绑: {m.group(1)} != {head}")
          if not os.path.exists("pytest.log"): fail("pytest.log 缺失")
          print(f"risk-display OK: tier={tier} head={head[:8]} integrity_keys_ok")
          EOF
      - name: 上传材料包与证据
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: review-bundle-${{ github.event.pull_request.head.sha }}
          path: |
            review-bundle.md
            integrity.json
            tier.txt
            pytest.log
