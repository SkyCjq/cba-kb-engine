name: Offline tests

on:
  push:
    branches: ['codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: PNG exclusion regression
        run: python -m pytest -q tests/test_source_exclusions.py
      - name: Offline regression suite
        run: python -m pytest -q -rs
