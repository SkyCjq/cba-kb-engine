[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cba-kb-engine"
version = "1.5.0.dev0"
requires-python = ">=3.11"
dependencies = ["google-api-python-client", "google-auth-oauthlib", "openpyxl", "PyYAML", "lxml", "beautifulsoup4", "pypdf", "python-docx"]

[project.scripts]
cba-kb = "cba_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "legacy"]
pythonpath = ["src", "legacy"]
