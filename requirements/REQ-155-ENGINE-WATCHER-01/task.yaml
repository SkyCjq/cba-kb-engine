source_watcher_contract:
  revision: r5-20260912-detail-discovery
  discovery_api: https://server.cbaleague.com/news_register/detail
  child_api: https://server.cbaleague.com/news_register/detail
  page: https://www.cbaleague.com/#/news-register/detail/{article_id}
  seasons:
  - 2024-2025
  - 2025-2026
  - 2026-2027
  discovery_roots:
    2024-2025: 66b1de8bab
    2025-2026: 68932081bf
    2026-2027: 6a72fc344a
  discovery:
    source_field: data.detail_content
    child_link_pattern: /news-register/detail/<child_article_id>
    child_ids_dynamic: true
    deterministic_normalization: true
  coverage:
    canonical_team_count: 20
    child_publication_count_rule: '>= 20'
    supplemental_publications_allowed: true
  alias_normalization:
    source: config/club_aliases.yaml
    verified_aliases:
      吉林东北虎: 吉林九台农商行
    unknown_alias: fail_closed
  child_contract:
    json_shape:
    - code
    - message
    - data
    table_field: data.detail_content
    required_logical_fields:
    - 运动员
    - 注册类型
    - 合同类别
    - 合同原信息
    - 原CBA俱乐部
    - 公示截止时间
    - 备注
    contract_information_variants:
    - 合同剩余年限
    - 合同到期日
    per_child_schema_validation: true
    partial_failure: fail_closed
  snapshot_identity:
    includes:
    - source_contract_revision
    - season
    - frozen_index_article_id
    - index_content_sha256
    - deterministic_child_hashes
    child_order_independent: true
  row_key:
    fields:
    - season
    - child_article_id
    - row_index
    semantic_business_identity: false
  cadence: DAILY@10:00 Asia/Shanghai
  sequential_requests: true
  min_delay_seconds: 1.5
  jitter: true
  retries: 3
  backoff: true
  timeout_seconds: 20
  fail_closed_on:
  - '403'
  - '429'
  - index_fetch_failure
  - child_fetch_failure
  - child_json_schema_invalid
  - table_missing
  - unknown_table_schema
  - canonical_team_count_not_20
  - unknown_team_alias
  - duplicate_or_unresolved_team_mapping
  - partial_child_discovery
  - modify
  - delete
  - schema_drift
  no_canonical_write: true
full_regression_owner: github_actions
max_ci_repair_cycles: 3
context_policy: allowlist_only
log_policy: summary_or_failure_only
production_access: forbidden
optional_overlay:
  release_performance:
    enabled: true
    trigger: H
