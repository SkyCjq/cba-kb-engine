release_handoff:
  candidate_generator: scripts/generate_context_card.py
  history_audit: scripts/audit_current_history.py
  closure_entrypoint: cba_kb.release.prepare(closure=contract)
  closure_required_fields:
    - code_commit
    - previous_code_commit
    - baseline_release_id
    - registry_key
    - manifest_key
    - documents
    - zones
    - protected
  documents: [readme, index, context_card, version]
  protected_kinds: [master, six_table, source_registry, evidence]
  protected_item_fields: [id, name, sha256, kind]
  zone_fields: [current, history, staging, evidence]
  notes:
    - Local Trusted Runtime must freeze actual manifest IDs, evidence coverage and hashes before production GO.
    - Bind registry_release_id to the target release; UNRELEASED is never a published release.
    - Legacy workbook projection mappings are unresolved and intentionally block publication until frozen from real evidence.
    - Production mirror checks require a clean checkout of the merged commit on the frozen base.
    - New control files use staged stable IDs; rollback returns them to non-current staging and retains before/candidate evidence.
