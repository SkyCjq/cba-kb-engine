version: 1
_说明: >-
  club_id 的唯一解析来源。国内名与赛季冠名商名分开登记，未知名称在 production/strict
  模式下必须 fail-closed，不做模糊匹配。新增别名必须有真实来源证据，并补回归测试。
_来源: >-
  official_domestic 取自 20_data 现有 MASTER 与 60_config taxonomy；
  official_foreign_sponsor_by_season 取自对应赛季外籍球员注册来源文件的原始球队名。
_禁止: 未经证据的高风险别名（例如把无关球队昵称映射到 bayi）不得写入。

